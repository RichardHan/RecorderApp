name: TEMP chapters verify

# Temporary verification for the chapters PR: module-scoped device tests (the repo-wide job exceeds its 45-minute
# limit) plus the Room schema the build generates, so `12.json` can be committed. Removed once green.
on:
  push:
    branches: [ feat/chapters ]

permissions:
  contents: read

concurrency:
  group: temp-chapters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Chapters migration + chapter rows on a device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :data:database:connectedDebugAndroidTest :feature:player:connectedDebugAndroidTest --continue --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapters-reports
          path: |
            data/database/build/reports/androidTests/
            data/database/build/outputs/androidTest-results/
            feature/player/build/reports/androidTests/
            feature/player/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-schemas-chapters
          path: data/database/schemas/
          if-no-files-found: error
