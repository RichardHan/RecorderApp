name: TEMP settings ui check

# Temporary verification for PR #2: the full instrumented workflow exceeds its 45-minute job limit, so this runs only
# the affected module's UI test. Removed again once the focused run is green.
on:
  push:
    branches: [ feat/meeting-agenda-context ]

permissions:
  contents: read

concurrency:
  group: temp-settings-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  settings-ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run feature:settings UI test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :feature:settings:connectedDebugAndroidTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-ui-report
          path: |
            feature/settings/build/reports/androidTests/
            feature/settings/build/outputs/androidTest-results/
          if-no-files-found: ignore
