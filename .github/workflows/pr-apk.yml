name: PR APK

on:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

concurrency:
  group: pr-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
      - name: Fixed debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else echo "::warning::DEBUG_KEYSTORE_B64 not set: APK uses a random debug key (Drive sign-in fails, cannot install over previous build)"; fi
      - name: Unit tests + debug APK
        env:
          DRIVE_WEB_CLIENT_ID: ${{ secrets.DRIVE_WEB_CLIENT_ID }}
        run: |
          [ -n "$DRIVE_WEB_CLIENT_ID" ] || echo "::warning::DRIVE_WEB_CLIENT_ID secret not set: Drive sign-in will fail in this APK"
          ./gradlew test :app:assembleDebug -Parm64Only=true -PcompressNative=true --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-test-reports, path: '**/build/reports/tests/', if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: app/build/outputs/apk/debug/*.apk, if-no-files-found: error }
