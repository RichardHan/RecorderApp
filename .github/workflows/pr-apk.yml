name: PR APK

on:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

concurrency:
  group: pr-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties
      - name: Install Android SDK packages
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"'
      - name: Fixed debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then mkdir -p ~/.android && umask 077 && printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else echo "::warning::DEBUG_KEYSTORE_B64 not set: APK uses a random debug key (cannot install over previous build)"; fi
      - name: Unit tests + debug APK
        run: ./gradlew test assembleDebug -Parm64Only=true -PcompressNative=true --stacktrace
      - name: Remove keystore from runner
        if: always()
        run: rm -f ~/.android/debug.keystore
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-test-reports, path: '**/build/reports/tests/', if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: studio/build/outputs/apk/debug/*.apk, if-no-files-found: error }
