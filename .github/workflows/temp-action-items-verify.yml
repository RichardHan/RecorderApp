name: TEMP action items verify

# Temporary verification for the action-items PR: the repo-wide instrumented job exceeds its 45-minute limit, so this
# runs only the two affected modules. It also uploads the Room schema that the build generates, so `11.json` can be
# committed. Removed again once the runs are green.
on:
  push:
    branches: [ feat/action-items ]

permissions:
  contents: read

concurrency:
  group: temp-action-items-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Room migration + to-do rows on a device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :data:database:connectedDebugAndroidTest :feature:player:connectedDebugAndroidTest --continue --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: action-items-reports
          path: |
            data/database/build/reports/androidTests/
            data/database/build/outputs/androidTest-results/
            feature/player/build/reports/androidTests/
            feature/player/build/outputs/androidTest-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-schemas
          path: data/database/schemas/
          if-no-files-found: error
